<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ciara Assistant</title>
    <meta name="description" content="Personal business management for authors and artists" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/ciara.svg" sizes="any" type="image/svg+xml" />

    <!-- PWA: Apple / iOS meta tags (Safari reads these, not the manifest) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ciara" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- PWA: theme color shown in the browser chrome on Android -->
    <meta name="theme-color" content="#4f46e5" />

    <!-- Preconnect to Google Fonts for Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite injects the compiled JS here -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
